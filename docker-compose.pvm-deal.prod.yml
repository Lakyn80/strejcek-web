services:
  backend:
    image: lakyn80/pvm-deal-backend:20260412-150104
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8070:5000"
    networks:
      - pvm

  frontend:
    image: lakyn80/pvm-deal-frontend:20260412-150104
    restart: always
    ports:
      - "127.0.0.1:8095:80"
    depends_on:
      - backend
    networks:
      - pvm

  accounting-backend:
    image: lakyn80/pvm-deal-accounting-backend:20260929-014900
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      ACCOUNTING_API_PREFIX: "/api/accounting"
      ACCOUNTING_DATABASE_URL: "sqlite:////data/accounting.db"
      ACCOUNTING_STORAGE_PATH: "/data/accounting-storage"
      ACCOUNTING_EMAIL_PROVIDER: "resend"
      ACCOUNTING_EMAIL_FROM: "faktury@pvm-deal.cz"
      RESEND_FROM_EMAIL: "faktury@pvm-deal.cz"
      RESEND_FROM_NAME: "PVM Deal"
      ACCOUNTING_INVOICE_COPY_EMAIL: "robin.strejcek@centrum.cz"
      ACCOUNTING_ARES_PROVIDER: "real"
      ADMIN_ALLOWED_ORIGINS: "https://admin.pvm-deal.cz,http://127.0.0.1:8096"
    volumes:
      - accounting_data:/data
    ports:
      - "127.0.0.1:8071:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pvm

  admin:
    image: lakyn80/pvm-deal-admin:20260929-014900
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:80"
    depends_on:
      accounting-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/accounting/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - pvm

networks:
  pvm:
    driver: bridge

volumes:
  accounting_data:
